<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="880" viewBox="0 0 1560 880" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1560" height="880" fill="#fbfcfe"/><text x="780.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">eval-forge - the CI gate pipeline</text><text x="780.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">Score a target against a YAML eval set; if the weighted aggregate misses the bar, the build fails.</text><rect x="50" y="158" width="350" height="270" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="149" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">1 - INPUTS</text><rect x="70" y="190" width="310" height="122" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,205) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></g><text x="116" y="221" font-size="16.5" font-weight="700" fill="#136b74">YAML eval set</text><text x="87" y="243.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">threshold: the gate bar</text><text x="87" y="260.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">cases: input + scorer,</text><text x="87" y="278.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">expected / pattern,</text><text x="87" y="296.4" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">weight, pass_score</text><rect x="70" y="328" width="310" height="87" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,343) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z"/></g><text x="116" y="359" font-size="16.5" font-weight="700" fill="#136b74">Target</text><text x="87" y="381.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">module:function</text><text x="87" y="398.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">str -&gt; str, called per case</text><rect x="440" y="158" width="760" height="270" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="458" y="149" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#552fae">2 - SCORE EVERY CASE</text><rect x="470" y="205" width="300" height="87" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(486,220) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z"/></g><text x="516" y="236" font-size="16.5" font-weight="700" fill="#552fae">Run target</text><text x="487" y="258.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">output =</text><text x="487" y="275.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">target(input)</text><rect x="830" y="205" width="300" height="87" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(846,220) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M6 8h12"/><path d="M4 18h6l-3-7z"/><path d="M14 18h6l-3-7z"/></g><text x="876" y="236" font-size="16.5" font-weight="700" fill="#552fae">Apply scorer</text><text x="847" y="258.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">exact / contains / regex /</text><text x="847" y="275.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">semantic -&gt; score in 0..1</text><path d="M382,251 L466,244" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><rect x="396.0" y="235.5" width="56.0" height="24.0" rx="12" fill="#ffffff" stroke="#2aa5b0" stroke-opacity="0.4"/><text x="424.0" y="251.94" text-anchor="middle" font-size="12" font-weight="600" fill="#136b74">cases</text><path d="M382,371 L466,262" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><rect x="395.424" y="304.5" width="57.152" height="24.0" rx="12" fill="#ffffff" stroke="#2aa5b0" stroke-opacity="0.4"/><text x="424.0" y="320.94" text-anchor="middle" font-size="12" font-weight="600" fill="#136b74">target</text><path d="M770,248 L828,248" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><path d="M980,292 L980.0,330.0 Q980,345 965.0,345.0 L635.0,345.0 Q620,345 620.0,330.0 L620,292" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="760.624" y="333.0" width="78.752" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="800" y="349.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">next case</text><path d="M1130,248 L1230.0,248.0 Q1245,248 1245.0,263.0 L1245.0,438.0 Q1245,453 1230.0,453.0 L245.0,453.0 Q230,453 230.0,468.0 L230,518" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><rect x="658.448" y="441.0" width="123.104" height="24.0" rx="12" fill="#ffffff" stroke="#8494ab" stroke-opacity="0.4"/><text x="720" y="457.44" text-anchor="middle" font-size="12" font-weight="600" fill="#3d4a63">all cases scored</text><rect x="50" y="478" width="1460" height="232" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="469" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">3 - GATE THE BUILD</text><rect x="80" y="520" width="300" height="87" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(96,535) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v5a5 5 0 0 0 5 5h7"/><path d="M6 21v-5a5 5 0 0 1 5-5"/><path d="M15 10l3 3-3 3"/></g><text x="126" y="551" font-size="16.5" font-weight="700" fill="#9e2b36">Weighted aggregate</text><text x="97" y="573.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">sum(score * weight)</text><text x="97" y="590.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">/ sum(weight), to 4 dp</text><rect x="470" y="520" width="300" height="87" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(486,535) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M6 8h12"/><path d="M4 18h6l-3-7z"/><path d="M14 18h6l-3-7z"/></g><text x="516" y="551" font-size="16.5" font-weight="700" fill="#8c5a0d">Meets the bar?</text><text x="487" y="573.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">aggregate &gt;= threshold</text><text x="487" y="590.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">(0.8 if the set omits it)</text><rect x="900" y="486" width="280" height="87" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(916,501) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></g><text x="946" y="517" font-size="16.5" font-weight="700" fill="#186547">PASS - exit 0</text><text x="917" y="539.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">report.passed = true</text><text x="917" y="556.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">deploy proceeds</text><rect x="900" y="612" width="280" height="87" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(916,627) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g><text x="946" y="643" font-size="16.5" font-weight="700" fill="#9e2b36">FAIL - exit != 0</text><text x="917" y="665.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">report.passed = false</text><text x="917" y="682.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">build is blocked</text><path d="M380,563 L468,563" stroke="#e0a13a" stroke-width="2.0" fill="none" marker-end="url(#ah-amber)"/><path d="M770,552 L826.5,552.0 Q838,552 838.0,540.5 L838.0,540.5 Q838,529 849.5,529.0 L898,529" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><rect x="813.6" y="493.0" width="48.8" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="838" y="509.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">pass</text><path d="M770,574 L823.0,574.0 Q838,574 838.0,589.0 L838.0,640.0 Q838,655 853.0,655.0 L898,655" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="818.136" y="603.0" width="39.728" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="838" y="619.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">fail</text><rect x="50" y="730" width="473" height="95.19999999999999" rx="11" fill="#eef1f6" stroke="#8494ab" stroke-width="1.4" stroke-opacity="0.8"/><text x="66" y="754" font-size="13.2" font-weight="700" fill="#3d4a63">Two thresholds, and they are independent</text><text x="66" y="776" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">pass_score marks a single case pass (&gt;=, default 0.5).</text><text x="66" y="794.4" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">The gate itself is the weighted aggregate vs threshold.</text><text x="66" y="812.8" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">A case can miss its bar while the suite still passes.</text><rect x="543" y="730" width="473" height="95.19999999999999" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="559" y="754" font-size="13.2" font-weight="700" fill="#186547">Deterministic by default</text><text x="559" y="776" font-size="12.4" fill="#186547" fill-opacity="0.92">Built-in scorers are pure functions: exact_match,</text><text x="559" y="794.4" font-size="12.4" fill="#186547" fill-opacity="0.92">contains, regex, semantic. A red build reproduces.</text><text x="559" y="812.8" font-size="12.4" fill="#186547" fill-opacity="0.92">LLM-as-judge is opt-in through the same interface.</text><rect x="1036" y="730" width="473" height="95.19999999999999" rx="11" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.4" stroke-opacity="0.8"/><text x="1052" y="754" font-size="13.2" font-weight="700" fill="#17509f">The gate is just an exit code</text><text x="1052" y="776" font-size="12.4" fill="#17509f" fill-opacity="0.92">run_eval -&gt; report.passed; the CLI returns 0 or 1.</text><text x="1052" y="794.4" font-size="12.4" fill="#17509f" fill-opacity="0.92">Drops into any CI as one more step that can fail.</text><text x="1052" y="812.8" font-size="12.4" fill="#17509f" fill-opacity="0.92">The aggregate is rounded to 4 dp before comparing.</text><text x="780.0" y="862" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/eval-forge</text></svg>